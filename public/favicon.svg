<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
>
    <path
        class="curve"
        d="M 10 45
           C 19 30, 31 24, 40 27
           C 46 29, 49 34, 54 33"
        fill="none"
        stroke-width="1.35"
        stroke-linecap="round"
    />

    <circle class="firefly" cx="17" cy="21" r="1.8" />
    <circle class="stelle" cx="49" cy="45" r="2.4" />

    <style>

        .curve {
            stroke: #596574;
        }

        .firefly {
            fill: #3f8f80;
        }

        .stelle {
            fill: #9a7940;
        }

        @media (prefers-color-scheme: dark) {
            .curve {
                stroke: #cfd5df;
            }

            .firefly {
                fill: #8fd8c8;
            }

            .stelle {
                fill: #e8d9b5;
            }
        }
    </style>
</svg>
